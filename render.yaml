# Creates NEW resources. For the existing live service, follow README instructions.
services:
  - type: web
    name: neon-notes-auth
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: neon-notes-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: neon-notes-db
    databaseName: neon_notes
    user: neon_notes
    plan: free
    ipAllowList: []
